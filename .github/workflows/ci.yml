name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Java 21, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make mvnw executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x ./mvnw

      - name: Run Maven Tests
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd.exe /c "mvnw.cmd clean test"
          else
            ./mvnw clean test
          fi
        shell: bash

      - name: Build JARs and verify CLI wrapper
        run: |
          npm run build
          npm test
        shell: bash
